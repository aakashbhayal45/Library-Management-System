<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --navy-primary: #001f3f;
            --navy-dark: #00142b;
            --accent-blue: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --bg-main: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top right, #002e5c, var(--navy-primary));
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 3rem 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .login-header {
            margin-bottom: 2.5rem;
        }

        .login-header .logo-box {
            width: 60px;
            height: 60px;
            background: var(--navy-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 31, 63, 0.2);
        }

        .login-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            color: var(--navy-primary);
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: #64748b;
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-control {
            position: relative;
        }

        .input-control i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            transition: color 0.3s;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 45px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background: #f8fafc;
        }

        .form-group input:focus {
            border-color: var(--accent-blue);
            background: white;
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .form-group input:focus + i {
            color: var(--accent-blue);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: var(--navy-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(0, 31, 63, 0.2);
        }

        .btn-login:hover {
            background: #002e5c;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 31, 63, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-msg {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 500;
            border: 1px solid #fecaca;
        }

        .footer-text {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .footer-text a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
        }

        /* Glass blobs for background decoration */
        .decoration-blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent-blue);
            filter: blur(100px);
            opacity: 0.3;
            z-index: -1;
            border-radius: 50%;
        }

        .blob-1 { top: -100px; left: -100px; }
        .blob-2 { bottom: -100px; right: -100px; background: #06b6d4; }
    </style>
</head>
<body>
    <div class="decoration-blob blob-1"></div>
    <div class="decoration-blob blob-2"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-box">
                    <i class="fas fa-book-open" style="color: white; font-size: 1.8rem;"></i>
                </div>
                <h1>Admin Login</h1>
            </div>

            <div id="errorMsg" class="error-msg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-control">
                        <input type="text" id="username" placeholder="Username" required>
                        <i class="fas fa-user-shield"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-control">
                        <input type="password" id="password" placeholder="Password" required>
                        <i class="fas fa-key"></i>
                    </div>
                </div>
                <button type="submit" class="btn-login">
                    <span>Login</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = e.target.querySelector('button');

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            // UI Feedback
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

            // Simulate slight delay for professional feel
            await new Promise(r => setTimeout(r, 600));

            // Hardcoded Demo Credentials
            // if (username === 'admin' && password === 'admin123') {
            //     localStorage.setItem('isAdminLoggedIn', 'true');
            //     window.location.href = 'dashboard.html';
            //     return;
            // }

            // Fallback to Backend API
            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    localStorage.setItem('isAdminLoggedIn', 'true');
                    window.location.href = 'dashboard.html';
                } else {
                    showError("Access Denied: Invalid credentials");
                }
            } catch (err) {
                console.error(err);
                showError("Admin Offline: Connection to API failed");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Login</span><i class="fas fa-arrow-right"></i>';
            }
        });

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
            
            // Shake animation for error
            const card = document.querySelector('.login-card');
            card.style.animation = 'shake 0.4s ease-in-out';
            setTimeout(() => card.style.animation = '', 400);
        }
    </script>

    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
    </style>
</body>
</html>
