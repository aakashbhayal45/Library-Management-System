<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Antigravity LMS</title>
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">
                    <i class="fas fa-book-open" style="color: white; font-size: 1.25rem;"></i>
                </div>
                <h2>Library</h2>
            </div>
            <nav class="sidebar-menu">
                <div class="sidebar-item">
                    <a class="sidebar-link active" onclick="showSection('dashboard', this)">
                        <i class="fas fa-chart-pie"></i> <span>Dashboard</span>
                    </a>
                </div>
                <div class="sidebar-item">
                    <a class="sidebar-link" onclick="showSection('books', this)">
                        <i class="fas fa-book"></i> <span>Books</span>
                    </a>
                </div>
                <div class="sidebar-item">
                    <a class="sidebar-link" onclick="showSection('users', this)">
                        <i class="fas fa-users"></i> <span>Users</span>
                    </a>
                </div>
                <div class="sidebar-item">
                    <a class="sidebar-link" onclick="showSection('issue', this)">
                        <i class="fas fa-hand-holding-medical"></i> <span>Issue Book</span>
                    </a>
                </div>
                <div class="sidebar-item">
                    <a class="sidebar-link" onclick="showSection('return', this)">
                        <i class="fas fa-rotate-left"></i> <span>Return Book</span>
                    </a>
                </div>
                <div class="sidebar-item">
                    <a class="sidebar-link" onclick="showSection('fine', this)">
                        <i class="fas fa-receipt"></i> <span>Fine Reports</span>
                    </a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <a class="sidebar-link" onclick="logout()" style="color: #ef4444;">
                    <i class="fas fa-power-off"></i> <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div>
                    <h1 style="font-size: 2.2rem; color: var(--navy-primary); font-family: 'Outfit', sans-serif;">Dashboard</h1>
                </div>
            </header>

            <!-- Dynamic Content Area -->
            <div id="main-content">
                <div class="loader-wrapper">
                    <div class="loader"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals Overlay -->
    <div id="modalOverlay" class="modal-overlay">
        <!-- Injected via script.js -->
    </div>

    <!-- JavaScript Dependencies -->
    <script src="js/script.js"></script>
    <script>
        // Authentication Guard
        if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
